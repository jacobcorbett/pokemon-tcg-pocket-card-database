name: Release versioned data
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm pack --ignore-scripts
      - run: node scripts/check-package.js
      - name: Archive data and calculate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -czf "pocket-data-${RELEASE_TAG}.tar.gz" -C dist v1
          sha256sum pocket-data-*.tar.gz pokemon-tcg-pocket-card-database-*.tgz > SHA256SUMS
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes pocket-data-*.tar.gz pokemon-tcg-pocket-card-database-*.tgz SHA256SUMS
